# 在 Orin 上：cd ~/go2w/docker && docker compose up -d --build
name: go2w

x-common: &common
  image: go2w-humble:dev
  network_mode: host      # 雷达走原始 UDP，DDS 也直接用宿主机网卡
  ipc: host
  init: true
  restart: unless-stopped # 开机自启；docker 本身已配置为等时间同步后启动
  environment:
    - TZ=Asia/Shanghai
  volumes:
    - ..:/go2w
    - /etc/localtime:/etc/localtime:ro
  working_dir: /go2w/ws

services:
  # 导航核心：交互开发、运行各阶段 launch
  ros:
    <<: *common
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: go2w_humble

  # 可视化桥：域 43 → 域 44（Wi-Fi），独立运行，挂了不影响导航核心
  viz_bridge:
    <<: *common
    container_name: go2w_viz_bridge
    depends_on: [ros]
    command: >
      bash -c "source /go2w/docker/ros_env.sh &&
               exec ros2 run domain_bridge domain_bridge /go2w/ws/src/go2w_bringup/config/viz_bridge.yaml"

  # 网页控制台：域 43 → http://<导航主机>:8080（Wi-Fi），独立运行，挂了不影响导航核心
  web:
    <<: *common
    container_name: go2w_web
    depends_on: [ros]
    # 运行档位（启停建图 / 定位 / 导航、巡逻、录包）要在 go2w_humble 里 docker exec，所以挂 docker.sock。
    # 注意：这等于给了网页后端控制本机 docker 的权限；后端只执行固定的几种命令（见 web/server/procs.py）
    volumes:
      - ..:/go2w
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: >
      bash -c "source /go2w/docker/ros_env.sh &&
               exec python3 /go2w/web/server/go2w_web.py --port 8080"
