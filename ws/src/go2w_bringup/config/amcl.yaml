# AMCL：在已保存的地图上定位（发布 map → odom）
# 里程计来自 FAST-LIO 平面 odom，精度远高于轮式里程计，所以运动噪声 alpha 设得比默认（0.2）小
amcl:
  ros__parameters:
    use_sim_time: false
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_footprint
    scan_topic: /scan
    tf_broadcast: true
    transform_tolerance: 0.5
    # 启动时先用地图原点作初始位姿，让 map 坐标系立即存在（Foxglove 在 map 不存在时不画地图）；
    # 实际位姿仍需在 Foxglove / RViz 里用 Pose estimate 拖准。nav.sh 只认手动设置（initialPoseReceived），不受影响
    set_initial_pose: true
    initial_pose: {x: 0.0, y: 0.0, z: 0.0, yaw: 0.0}

    # 全向模型：能正确处理倒车转向时的横向位移/侧滑。
    # 10-21 用差速模型时，倒车+转向过程中粒子散开（±0.1 m → ±1.1 m/84°），改用全向模型（旧系统也是）
    robot_model_type: nav2_amcl::OmniMotionModel
    alpha1: 0.1
    alpha2: 0.1
    alpha3: 0.1
    alpha4: 0.1
    alpha5: 0.1

    laser_model_type: likelihood_field
    laser_likelihood_max_dist: 2.0
    laser_max_range: 20.0
    laser_min_range: 0.45
    max_beams: 120
    sigma_hit: 0.2
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    do_beamskip: false

    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    update_min_d: 0.10
    update_min_a: 0.10
    save_pose_rate: 0.5
