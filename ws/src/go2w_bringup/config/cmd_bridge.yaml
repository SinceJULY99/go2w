# go2w_cmd_bridge：/cmd_vel → Go2W sport 接口
# 限速逐步放开；运行中可改：ros2 param set /go2w_cmd_bridge max_vx 0.45
go2w_cmd_bridge:
  ros__parameters:
    max_vx: 1.0          # m/s（10-22 由 0.3 提到 0.45，10-30 提到 1.0）
    max_vy: 0.0          # m/s（Go2W 能横移，但会迈腿踏步；10-29 由 0.1 改 0，与 Nav2 一致）
    max_wz: 1.2          # rad/s（约 69°/s；10-22 由 30°/s 提到 46°/s，10-28 再提到 69°/s）
    cmd_timeout: 0.3     # s，超过这么久没有新 /cmd_vel 就停车
    require_odom_healthy: true
    deadband: 0.01
    wz_deadband_moving: 0.08   # rad/s，前进 >0.05 m/s 时 |wz| 小于它就置零（10-29：行进中转向 ≳0.05 Go2W 会踏步）
    rate: 20.0           # Hz，向主控发 Move 的频率（主控 1 s 收不到会自停）
